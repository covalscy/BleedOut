modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="bleedout_icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="bleedout.mixins.json"

[[mixins]]
config="bleedout.tacz.mixins.json"

[[mixins]]
config="bleedout.ragdoll.mixins.json"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="bleedout_ragdolls"
    type="optional"
    versionRange="[0.8.0,)"
    ordering="AFTER"
    side="BOTH"
