pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

// Подключаем исходники BloodyBits как отдельную composite-сборку.
// Это позволяет собирать его jar локально без CurseMaven.
includeBuild('BloodyBits-main')
